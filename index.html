<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mixer</title>
  <meta name="description" content="Ghép phụ âm, nguyên âm và thanh điệu thành từ tiếng Việt bằng thẻ kéo thả.">
  <meta name="author" content="mahnduc">
  <meta name="theme-color" content="#00d2ff">
  <link rel="canonical" href="https://mahnduc.github.io/mixer/">
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/boxicons/dino.svg?color=%23b8573a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mixer">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:url" content="https://mahnduc.github.io/mixer/">
  <meta property="og:title" content="Mixer">
  <meta property="og:description" content="Ghép phụ âm, nguyên âm và thanh điệu thành từ tiếng Việt bằng thẻ kéo thả.">
  <meta property="og:image" content="https://mahnduc.github.io/mixer/assets/boxicons--dino.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Mixer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mixer">
  <meta name="twitter:description" content="Ghép phụ âm, nguyên âm và thanh điệu thành từ tiếng Việt bằng thẻ kéo thả.">
  <meta name="twitter:image" content="https://mahnduc.github.io/mixer/assets/boxicons--dino.png?v=2">
  <link rel="stylesheet" href="./theme.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script>tailwind.config = { theme: { extend: { colors: Object.fromEntries(["bg", "text", "muted", "con", "con-t", "vow", "vow-t", "hl"].map(k => [k, `var(--${k})`])) } } };</script>
  <style>
    #aboutPopup {
      animation: aboutFadeIn .2s ease-out
    }

    #aboutSheet {
      animation: aboutScaleIn .25s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes aboutFadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes aboutScaleIn {
      from {
        opacity: 0;
        transform: scale(.94) translateY(10px)
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    .about-dino-wrap {
      position: relative;
      display: flex;
      flex: 0 0 48%;
      min-width: 0;
      height: 340px;
      align-items: center;
      justify-content: center
    }

    .about-dino-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 310px;
      height: 310px;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 45%, #b8573a 100%);
      -webkit-mask: url("https://api.iconify.design/boxicons/dino.svg") center/contain no-repeat;
      mask: url("https://api.iconify.design/boxicons/dino.svg") center/contain no-repeat;
      opacity: .25;
      pointer-events: none
    }

    .about-gradient {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 25% 50%, color-mix(in srgb, var(--con) 15%, transparent), transparent 65%), radial-gradient(circle at 100% 100%, color-mix(in srgb, var(--vow) 12%, transparent), transparent 50%);
      pointer-events: none
    }

    @media(max-width:480px) {
      #aboutSheet {
        max-width: 100%;
        min-height: 280px
      }

      .about-dino-wrap {
        flex-basis: 44%;
        height: 250px
      }

      .about-dino-bg {
        width: 210px;
        height: 210px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      #aboutPopup,
      #aboutSheet {
        animation: none
      }
    }
  </style>
</head>

<body class="relative min-h-[100svh] flex flex-col overflow-x-hidden bg-bg text-text font-sans">
  <header
    class="relative z-10 flex items-center gap-2.5 px-5 pt-[max(1.25rem,env(safe-area-inset-top))] text-3xl font-extrabold">
    <button id="aboutTrigger" type="button" aria-label="Thông tin về Mixer" aria-haspopup="dialog" aria-expanded="false"
      class="flex items-center gap-2.5 rounded-xl outline-none transition hover:opacity-80 active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-hl"><iconify-icon
        icon="boxicons:dino" class="size-8 text-con"></iconify-icon><span
        class="bg-gradient-to-r from-con to-vow bg-clip-text text-transparent">Mixer</span></button></header>
  <main class="flex-1 flex flex-col items-center px-4 pt-[10vh] pb-12">
    <div class="flex flex-col items-center gap-6">
      <div id="row" class="flex flex-wrap justify-center gap-3 sm:gap-5"></div>
      <p id="result" aria-live="polite" class="min-h-12 text-4xl font-bold tracking-wide"></p><button id="confirm"
        type="button" disabled
        class="flex items-center gap-2 px-8 py-3 rounded-full font-bold text-con-t bg-gradient-to-r from-con to-vow shadow-[0_8px_24px_color-mix(in_srgb,var(--con)_35%,transparent)] transition duration-150 ease-out enabled:hover:brightness-110 enabled:hover:-translate-y-0.5 enabled:active:scale-95 enabled:active:translate-y-0 enabled:active:brightness-90 enabled:active:shadow-[0_2px_8px_color-mix(in_srgb,var(--con)_35%,transparent)] focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-hl opacity-40 disabled:cursor-not-allowed"><iconify-icon
          icon="andrsrxn:cursor-click" class="size-5 shrink-0"></iconify-icon>Mix</button>
    </div>
    <section class="w-[min(92vw,640px)] mt-12">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold">Danh sách từ đã ghép</h2><span id="count" class="text-sm text-muted">0 từ</span>
      </div>
      <div id="savedWords" class="border-t border-[color-mix(in_srgb,var(--text)_15%,transparent)]">
        <p class="py-6 text-center text-muted">Chưa có từ nào được lưu.</p>
      </div>
    </section>
  </main>
  <div id="panel"
    class="hidden fixed inset-0 z-50 overflow-auto bg-black/30 p-3 sm:p-5 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
    <section id="sheet"
      class="w-full max-w-5xl min-w-0 m-auto p-4 sm:p-6 rounded-3xl bg-bg shadow-[0_20px_60px_rgba(0,0,0,.35)]"><label
        class="mb-5 flex items-center gap-3 px-4 h-12 rounded-2xl bg-[color-mix(in_srgb,var(--text)_8%,transparent)]"><i
          data-lucide="keyboard" class="size-5 shrink-0 text-muted"></i><input id="typed" type="text" autocomplete="off"
          autocapitalize="off" spellcheck="false" placeholder="Gõ âm rồi nhấn Enter" aria-label="Gõ âm từ bàn phím"
          class="flex-1 w-0 min-w-0 bg-transparent outline-none text-base placeholder:text-muted"></label>
      <div id="groups" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full min-w-0"></div>
      <div id="tones" class="hidden mt-5 pt-5 border-t border-[color-mix(in_srgb,var(--text)_15%,transparent)]">
        <p id="toneLabel" class="mb-3 text-sm font-medium text-muted"></p>
        <div id="toneKeys" class="grid grid-cols-3 sm:grid-cols-6 gap-2 w-full"></div>
      </div>
    </section>
  </div>
  <div id="aboutPopup"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/45 p-3 sm:p-5 backdrop-blur-md">
    <section id="aboutSheet" role="dialog" aria-modal="true" aria-labelledby="aboutTitle"
      class="relative isolate w-full max-w-2xl min-h-[400px] overflow-hidden rounded-[2rem] bg-bg shadow-[0_20px_60px_rgba(0,0,0,.35)]">
      <div class="about-gradient"></div><button id="aboutClose" type="button" aria-label="Đóng"
        class="absolute right-5 top-5 z-20 flex size-10 items-center justify-center rounded-full bg-[color-mix(in_srgb,var(--text)_8%,transparent)] text-muted transition hover:bg-[color-mix(in_srgb,var(--text)_15%,transparent)] hover:text-text active:scale-90"><i
          data-lucide="x" class="size-5"></i></button>
      <div class="relative z-10 flex min-h-[400px] items-center gap-1 px-2 py-8 sm:px-4">
        <div class="about-dino-wrap" aria-hidden="true">
          <div class="about-dino-bg"></div>
        </div>
        <div class="flex min-w-0 flex-1 flex-col items-start justify-center pl-1 pr-5 sm:pl-2 sm:pr-8">
          <h2 id="aboutTitle"
            class="text-6xl sm:text-7xl font-black tracking-tight bg-gradient-to-r from-con to-vow bg-clip-text text-transparent drop-shadow-sm">
            Mixer</h2>
          <p class="mt-3 text-base sm:text-lg font-medium text-muted">by <span
              class="font-bold text-text">mahnduc</span></p><a href="https://github.com/mahnduc/mixer" target="_blank"
            rel="noopener noreferrer"
            class="mt-8 inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-con to-vow px-5 py-3.5 text-sm font-bold text-con-t shadow-[0_6px_24px_color-mix(in_srgb,var(--con)_30%,transparent)] transition hover:brightness-110 active:scale-[.97]"><i
              data-lucide="github" class="size-4"></i>GitHub<i data-lucide="external-link" class="size-3.5"></i></a>
        </div>
      </div>
    </section>
  </div>
  <script src="./app.js"></script>
  <script>if (window.lucide) { lucide.createIcons(); }</script>
  <script>(() => { const trigger = document.getElementById("aboutTrigger"); const popup = document.getElementById("aboutPopup"); const sheet = document.getElementById("aboutSheet"); const closeButton = document.getElementById("aboutClose"); if (!trigger || !popup || !sheet || !closeButton) return; let previousOverflow = ""; function openAbout() { previousOverflow = document.body.style.overflow; popup.classList.remove("hidden"); trigger.setAttribute("aria-expanded", "true"); document.body.style.overflow = "hidden"; closeButton.focus(); } function closeAbout() { if (popup.classList.contains("hidden")) return; popup.classList.add("hidden"); trigger.setAttribute("aria-expanded", "false"); document.body.style.overflow = previousOverflow; trigger.focus(); } trigger.addEventListener("click", openAbout); closeButton.addEventListener("click", closeAbout); popup.addEventListener("click", event => { if (event.target === popup) { closeAbout(); } }); sheet.addEventListener("click", event => { event.stopPropagation(); }); document.addEventListener("keydown", event => { if (event.key === "Escape" && !popup.classList.contains("hidden")) { closeAbout(); } }); })();</script>
</body>

</html>

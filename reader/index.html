<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Trình xem tệp</title>
  <meta name="description" content="Mixer made by Mạnh Đức.">
  <meta name="author" content="mahnduc">
  <meta name="theme-color" content="#f6f3ee" id="themeColor">
  <link rel="canonical" href="https://mahnduc.github.io/mixer/">
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/boxicons/dino.svg?color=%23b8573a">

  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("mixer-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        console.warn("Không thể đọc thiết lập giao diện:", error);
      }
    })();
  </script>

  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="./reader.css">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: Object.fromEntries(
            ["bg", "text", "muted", "con", "con-t", "vow", "vow-t", "hl"]
              .map(k => [k, `var(--${k})`])
          )
        }
      }
    };
  </script>

  <style>
    #selBtn[hidden] { display: none; }
    #selBtn {
      position: fixed;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: .375rem;
      padding: .45rem .8rem;
      border: 0;
      border-radius: 9999px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600; font-size: 13px; line-height: 1; font-family: inherit;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    #selBtn:active { transform: scale(.95); }

    mark.annot-hl {
      background: color-mix(in srgb, var(--hl, #f5c542) 38%, transparent);
      color: inherit;
      border-radius: 2px;
      cursor: pointer;
      -webkit-text-fill-color: currentColor;
    }

    .annot-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
    .annot-row {
      display: flex; flex-direction: column; gap: .3rem;
      padding: .5rem .6rem; border-radius: .75rem;
      background: color-mix(in srgb, var(--text) 6%, transparent);
    }
    .annot-top { display: flex; align-items: center; gap: .15rem; }
    .annot-quote {
      flex: 1; min-width: 0; display: block; text-align: left;
      border: 0; background: none; padding: 0;
      font-size: .85rem; line-height: 1.6; color: var(--text); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .annot-quote:hover { color: var(--accent); }
    .annot-input {
      width: 100%; resize: none; box-sizing: border-box;
      min-height: 3.2rem; max-height: 10rem;
      padding: .45rem .55rem; border-radius: .5rem;
      border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
      background: var(--bg); color: var(--text);
      font: inherit; font-size: .85rem; line-height: 1.4; outline: none;
    }
    .annot-input:focus { border-color: var(--con); }

    .toc-export {
      pointer-events: auto;
      margin-left: auto;
      display: inline-flex; align-items: center; justify-content: center;
      width: 1.6rem; height: 1.6rem; border-radius: .4rem;
      color: var(--muted); cursor: pointer;
    }
    .toc-export:hover, .toc-export:focus-visible {
      color: var(--text);
      background: color-mix(in srgb, var(--text) 12%, transparent);
      outline: none;
    }

    #exportMenu {
      position: fixed; z-index: 120; min-width: 15rem; padding: .3rem;
      display: flex; flex-direction: column; gap: .1rem;
      border-radius: .8rem; background: var(--bg);
      border: 1px solid color-mix(in srgb, var(--text) 15%, transparent);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
    }
    #exportMenu button {
      display: flex; align-items: center; gap: .5rem; width: 100%;
      padding: .5rem .7rem; border: 0; border-radius: .55rem; background: none;
      color: var(--text); font: inherit; font-size: .875rem; text-align: left; cursor: pointer;
    }
    #exportMenu button:hover { background: color-mix(in srgb, var(--text) 9%, transparent); }
    .api-box { margin-top: 1rem; display: flex; flex-direction: column; gap: .5rem; }
    .api-title { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .api-row { display: flex; gap: .5rem; }
    .api-row input {
      flex: 1; min-width: 0; height: 2.25rem; padding: 0 .9rem; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
      background: var(--bg); color: var(--text); font-size: .875rem; outline: none;
    }
    .api-row input:focus { border-color: var(--accent); }
    .api-msg { min-height: 1.1rem; font-size: .8rem; color: var(--muted); }
    .api-msg[data-err="1"] { color: #d9534f; }
    .toc-export + .toc-export { margin-left: 0; }
    .toc-export[aria-pressed="true"] { color: var(--accent); }
    .doc.no-bm .mk { display: none; }
    .doc.no-bm [data-marked] { background: none; box-shadow: none; }
    .doc, .doc * { -webkit-user-select: text; user-select: text; }
    .doc .mk, .doc .mk * { -webkit-user-select: none; user-select: none; }

    #annots { border: 0; border-radius: 0; background: none; padding: 0; box-shadow: none; }

    @media (max-width: 1023px) {
      #annots {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
        max-height: 45svh; overflow-y: auto; margin: 0;
        padding: .5rem 1.25rem calc(.75rem + env(safe-area-inset-bottom));
        background: var(--bg);
      }
    }
  </style>
</head>

<body class="relative min-h-[100svh] flex flex-col bg-bg text-text font-sans">
  <main>
    <div class="workspace">
      <aside class="rail" aria-label="Logo và tệp đã đánh dấu">
        <div class="rail-brand">
          <div class="inline-flex items-start">
            <button id="aboutTrigger" type="button" aria-label="Thông tin và tùy chọn tệp Mixer" aria-haspopup="dialog"
              aria-expanded="false"
              class="flex items-center gap-2.5 text-3xl font-extrabold outline-none transition hover:opacity-80 active:scale-95">
              <iconify-icon icon="boxicons:dino" class="size-8 text-con"></iconify-icon>
              <span class="bg-gradient-to-r from-con to-vow bg-clip-text text-transparent">Mixer</span>
            </button>

            <button id="themeToggle" type="button" aria-label="Chuyển sang giao diện tối"
              title="Chuyển giao diện sáng/tối"
              class="-ml-1 -mt-1 flex size-5 shrink-0 items-center justify-center text-muted outline-none">
              <iconify-icon id="themeIcon" icon="lucide:moon" class="size-4"></iconify-icon>
            </button>
          </div>
        </div>

        <nav id="marks" class="panel marks" aria-label="Tệp đã đánh dấu" hidden>
          <div class="panel-head">
            <iconify-icon icon="mdi:star"></iconify-icon>
            <span>Tệp đã đánh dấu</span>
            <span id="marksCount" class="count">0</span>
          </div>
          <ul id="marksList" class="marks-list"></ul>
        </nav>

        <nav id="spots" class="panel marks" aria-label="Vị trí đã đánh dấu trong tài liệu" hidden>
          <div class="panel-head">
            <span>Vị trí đánh dấu</span>
            <span id="spotsCount" class="count">0</span>
          </div>
          <ul id="spotsList" class="marks-list"></ul>
        </nav>

        <section id="annots" class="panel marks" aria-label="Ghi chú trong tài liệu" hidden>
          <ul id="annotsList" class="annot-list"></ul>
        </section>
      </aside>

      <div class="doc-column">
        <article id="doc" class="doc" hidden></article>
        <div id="legend" class="legend" hidden></div>
        <div id="notes" class="notes" hidden></div>
      </div>

      <aside id="toc" class="panel toc" aria-label="Mục lục" hidden></aside>
    </div>
  </main>

  <div id="exportMenu" role="menu" hidden>
    <button type="button" role="menuitem" data-mode="notes" data-zip="1">
      <iconify-icon icon="lucide:file-archive"></iconify-icon><span>Có ghi chú · nén .gz (nhẹ nhất)</span>
    </button>
    <button type="button" role="menuitem" data-mode="plain" data-zip="1">
      <iconify-icon icon="lucide:file-archive"></iconify-icon><span>Không ghi chú · nén .gz</span>
    </button>
    <button type="button" role="menuitem" data-mode="notes" data-zip="0">
      <iconify-icon icon="lucide:notebook-pen"></iconify-icon><span>Có ghi chú · JSON thường</span>
    </button>
    <button type="button" role="menuitem" data-mode="plain" data-zip="0">
      <iconify-icon icon="lucide:file-text"></iconify-icon><span>Không ghi chú · JSON thường</span>
    </button>
  </div>

  <button id="selBtn" type="button" hidden>
    <iconify-icon icon="lucide:message-square-plus"></iconify-icon>
    <span>Ghi chú</span>
  </button>

  <div id="aboutPopup"
    class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/45 p-3 sm:p-5 backdrop-blur-md">
    <section id="aboutSheet" role="dialog" aria-modal="true" aria-labelledby="aboutTitle"
      class="relative isolate w-full max-w-2xl min-h-[400px] overflow-hidden rounded-[2rem] bg-bg shadow-[0_20px_60px_rgba(0,0,0,.35)]">
      <div class="about-gradient"></div>

      <button id="aboutClose" type="button" aria-label="Đóng"
        class="absolute right-5 top-5 z-20 flex size-10 items-center justify-center rounded-full bg-[color-mix(in_srgb,var(--text)_8%,transparent)] text-muted transition hover:bg-[color-mix(in_srgb,var(--text)_15%,transparent)] hover:text-text active:scale-90">
        <i data-lucide="x" class="size-5"></i>
      </button>

      <div class="about-split relative z-10 flex min-h-[400px] items-stretch gap-2 px-2 py-8 sm:px-4">
        <div class="about-dino-wrap" aria-hidden="true">
          <div class="about-dino-bg"></div>
        </div>

        <div id="aboutTitle" class="sr-only">Mở và xem tệp Mixer</div>

        <div class="flex min-w-0 flex-1 flex-col justify-center pl-1 pr-5 sm:pl-2 sm:pr-8">
          <div id="aboutViewerBar" class="flex flex-wrap items-center gap-2">
            <label class="btn">Chọn tệp<input id="file" type="file" accept=".json,.gz,.zip,application/json,application/gzip,application/zip" hidden></label>
            <button id="tocToggle" type="button" class="btn" aria-pressed="true" hidden>Mục lục</button>
            <button id="bmBtn" type="button" class="btn" data-bm-toggle aria-pressed="true" hidden>Bookmark</button>
            <button id="exportBtn" type="button" class="btn" data-export-trigger title="Xuất JSON" hidden>Xuất JSON</button>
          </div>

          <div id="fileListWrap" class="file-list-wrap" hidden>
            <div class="file-list-title">
              <iconify-icon icon="lucide:files"></iconify-icon>
              <span>Danh sách tệp</span>
            </div>
            <ul id="fileList" class="file-list"></ul>
          </div>

          <form id="apiForm" class="api-box" autocomplete="off">
            <label for="apiUrl" class="api-title">
              <iconify-icon icon="lucide:link"></iconify-icon>
              <span>Dán API chứa JSON nén (.gz / .zip)</span>
            </label>
            <div class="api-row">
              <input id="apiUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://…/tai-lieu.json.gz">
              <button id="apiGo" type="submit" class="btn">Tải</button>
            </div>
            <div id="apiMsg" class="api-msg" role="status"></div>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }

    (() => {
      const root = document.documentElement;
      const toggle = document.getElementById("themeToggle");
      const icon = document.getElementById("themeIcon");
      const themeColor = document.getElementById("themeColor");

      if (!toggle || !icon) return;

      const STORAGE_KEY = "mixer-theme";
      const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

      function getCurrentTheme() {
        const manualTheme = root.dataset.theme;
        if (manualTheme === "light" || manualTheme === "dark") {
          return manualTheme;
        }
        return mediaQuery.matches ? "dark" : "light";
      }

      function updateThemeUI(theme) {
        const isDark = theme === "dark";
        icon.setAttribute("icon", isDark ? "lucide:sun" : "lucide:moon");
        toggle.setAttribute("aria-label", isDark ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối");
        toggle.setAttribute("title", isDark ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện tối");
        if (themeColor) {
          themeColor.setAttribute("content", isDark ? "#181a1d" : "#f6f3ee");
        }
      }

      function setTheme(theme, save = true) {
        if (theme !== "light" && theme !== "dark") return;
        root.dataset.theme = theme;
        if (save) {
          try {
            localStorage.setItem(STORAGE_KEY, theme);
          } catch (error) {
            console.warn("Không thể lưu giao diện:", error);
          }
        }
        updateThemeUI(theme);
      }

      updateThemeUI(getCurrentTheme());

      toggle.addEventListener("click", () => {
        const nextTheme = getCurrentTheme() === "dark" ? "light" : "dark";
        setTheme(nextTheme);
      });

      mediaQuery.addEventListener("change", () => {
        if (!root.dataset.theme) {
          updateThemeUI(getCurrentTheme());
        }
      });
    })();

    (() => {
      const trigger = document.getElementById("aboutTrigger");
      const popup = document.getElementById("aboutPopup");
      const sheet = document.getElementById("aboutSheet");
      const closeButton = document.getElementById("aboutClose");

      if (!trigger || !popup || !sheet || !closeButton) return;

      let previousOverflow = "";
      let lastOpener = trigger;

      function openAbout(opener = trigger) {
        if (!popup.classList.contains("hidden")) return;
        lastOpener = opener || trigger;
        previousOverflow = document.body.style.overflow;
        popup.classList.remove("hidden");
        trigger.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
        closeButton.focus();
      }

      function closeAbout(restoreFocus = true) {
        if (popup.classList.contains("hidden")) return;
        popup.classList.add("hidden");
        trigger.setAttribute("aria-expanded", "false");
        document.body.style.overflow = previousOverflow;
        sheet.classList.remove("over");
        if (restoreFocus && lastOpener && typeof lastOpener.focus === "function") {
          lastOpener.focus();
        }
      }

      trigger.addEventListener("click", () => openAbout(trigger));
      closeButton.addEventListener("click", () => closeAbout(true));

      popup.addEventListener("click", event => {
        if (event.target === popup) {
          closeAbout(true);
        }
      });

      sheet.addEventListener("click", event => {
        event.stopPropagation();
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !popup.classList.contains("hidden")) {
          closeAbout(true);
        }
      });

      const $ = id => document.getElementById(id);
      const GR = "gradient";
      const GRAD = "linear-gradient(to right, var(--con), var(--vow))";
      const FONTS = {
        arial: "Arial, Helvetica, sans-serif", verdana: "Verdana, Geneva, sans-serif",
        tahoma: "Tahoma, Geneva, sans-serif", trebuchet: '"Trebuchet MS", Helvetica, sans-serif',
        georgia: "Georgia, serif", times: '"Times New Roman", Times, serif',
        courier: '"Courier New", Courier, monospace', comic: '"Comic Sans MS", "Comic Neue", cursive'
      };
      const ALIGNS = ["left", "center", "right", "justify"];
      const SPECIAL_KINDS = ["quote", "cite", "poem", "dropcap"];
      const MAX_SIZE = 2 * 1024 * 1024;
      const MAX_PACKED = 5 * 1024 * 1024;
      const MAX_UNPACKED = 12 * 1024 * 1024;
      const TOC_PREF_KEY = "mixer-toc-visible";
      const MARKS_KEY = "mixer-marks";
      const SPOTS_KEY = "mixer-bookmarks";
      const ANNOT_KEY = "mixer-annots";
      const BM_KEY = "mixer-bookmark-ui";
      const RESERVED_KEYS = new Set(["mixer-theme", TOC_PREF_KEY, MARKS_KEY, SPOTS_KEY, ANNOT_KEY, BM_KEY]);
      const narrow = window.matchMedia("(max-width:1023px)");

      let tocEnabled = (() => {
        try {
          const saved = localStorage.getItem(TOC_PREF_KEY);
          return saved === null ? true : saved === "true";
        } catch {
          return true;
        }
      })();

      let marks = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(MARKS_KEY) || "[]");
          return new Set(Array.isArray(saved) ? saved.filter(x => typeof x === "string") : []);
        } catch {
          return new Set();
        }
      })();

      const spotStore = (() => {
        const store = new Map();
        try {
          const saved = JSON.parse(localStorage.getItem(SPOTS_KEY) || "{}");
          if (saved && typeof saved === "object" && !Array.isArray(saved)) {
            Object.entries(saved).forEach(([id, list]) => {
              if (Array.isArray(list)) store.set(id, new Set(list.filter(Number.isInteger)));
            });
          }
        } catch { }
        return store;
      })();

      const spotSet = id => {
        if (!spotStore.has(id)) spotStore.set(id, new Set());
        return spotStore.get(id);
      };

      function saveSpots() {
        try {
          const out = {};
          spotStore.forEach((set, id) => {
            if (id.startsWith("local:") && set.size) out[id] = [...set].sort((a, b) => a - b);
          });
          localStorage.setItem(SPOTS_KEY, JSON.stringify(out));
        } catch (error) {
          console.warn("Không thể lưu vị trí đánh dấu:", error);
        }
      }

      let bmOn = (() => {
        try { return localStorage.getItem(BM_KEY) !== "false"; } catch { return true; }
      })();
      const openNotes = new Set();

      let annots = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ANNOT_KEY) || "[]");
          return Array.isArray(saved)
            ? saved.filter(a => a && typeof a.id === "string" && typeof a.doc === "string" &&
              Number.isInteger(a.b) && Number.isInteger(a.s) && Number.isInteger(a.e) &&
              typeof a.quote === "string" && typeof a.note === "string")
            : [];
        } catch {
          return [];
        }
      })();

      let annotSaveTimer = 0;
      function saveAnnots() {
        try {
          localStorage.setItem(ANNOT_KEY, JSON.stringify(annots.filter(a => a.doc.startsWith("local:"))));
        } catch (error) {
          console.warn("Không thể lưu ghi chú:", error);
        }
      }

      const newAnnotId = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

      const color = v => v === GR ? GR : typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : null;
      const src = v => typeof v === "string" && v.length < 9e5 &&
        /^(?:https:\/\/[^\s"'()<>\\]{1,2000}|data:image\/(?:png|jpe?g|gif|webp|svg\+xml);base64,[a-z0-9+/=]+)$/i.test(v) ? v : null;
      const num = (v, a, b) => { v = Number(v); return Number.isFinite(v) && v >= a && v <= b ? Math.round(v) : null; };
      const mk = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };
      const ico = (name, cls) => {
        const n = document.createElement("iconify-icon");
        n.setAttribute("icon", name);
        if (cls) n.className = cls;
        return n;
      };
      const textSpan = (text, cls) => { const s = mk("span", cls); s.textContent = text; return s; };

      const S = (def, min, max) => ({ def, min, max });
      const PK = (def, opts) => ({ def, opts });
      const BL = def => ({ def, bool: true });
      const WEIGHTS = ["400", "500", "600", "700", "800", "900"];
      const head = (size, lh, top, bottom) => ({
        size: S(size, 10, 120), weight: PK("700", WEIGHTS),
        lh: S(lh, 0.8, 3), top: S(top, 0, 5), bottom: S(bottom, 0, 5)
      });
      const SCHEMA = {
        page: { top: S(8, 0, 200), right: S(12, 0, 300), bottom: S(8, 0, 200), left: S(12, 0, 300) },
        p: { lh: S(1.63, 1, 3), gap: S(0, 0, 3), indent: S(2, 0, 10) },
        h1: head(36, 1.2, 0.4, 0.2), h2: head(30, 1.25, 0.4, 0.2),
        h3: head(24, 1.3, 0.35, 0.15), h4: head(20, 1.35, 0.3, 0.1),
        quote: {
          size: S(1.15, 0.6, 3), italic: BL(true), align: PK("center", ALIGNS),
          top: S(0.6, 0, 5), bottom: S(0.2, 0, 5), side: S(1.5, 0, 10)
        },
        cite: {
          size: S(0.9, 0.5, 2), opacity: S(0.75, 0.2, 1), align: PK("right", ALIGNS),
          bottom: S(0.6, 0, 5), side: S(1.5, 0, 10)
        },

        poem: {
          size: S(1, 0.6, 3), lh: S(1.7, 1, 3), italic: BL(false),
          top: S(0.6, 0, 5), bottom: S(0.6, 0, 5)
        },

        dropcap: {
          lines: S(3, 2, 6), fit: S(1, 0.7, 1.3), space: S(0.02, -0.2, 1),
          weight: PK("700", WEIGHTS)
        }
      };

      function cleanStyle(v) {
        const src = v && typeof v === "object" && !Array.isArray(v) ? v : {};
        const out = {};
        Object.entries(SCHEMA).forEach(([g, fields]) => {
          const raw = src[g] && typeof src[g] === "object" ? src[g] : {};
          out[g] = {};
          Object.entries(fields).forEach(([k, spec]) => {
            const val = raw[k];
            if (spec.bool) out[g][k] = typeof val === "boolean" ? val : spec.def;
            else if (spec.opts) out[g][k] = spec.opts.includes(val) ? val : spec.def;
            else {
              const n = Number(val);
              out[g][k] = val === "" || val === null || val === undefined || !Number.isFinite(n)
                ? spec.def
                : Math.round(Math.min(spec.max, Math.max(spec.min, n)) * 100) / 100;
            }
          });
        });
        return out;
      }

      function readFormat(d) {
        const o = d && typeof d === "object" && !Array.isArray(d) ? d : {};
        return {
          style: cleanStyle(o.docStyle),
          size: num(o.docSize, 8, 200) ?? 18,
          font: typeof o.docFont === "string" && FONTS[o.docFont] ? o.docFont : "arial"
        };
      }

      let dcMetrics = { asc: 0.905, desc: 0.212, cap: 0.716 };
      const metricsCache = new Map();

      function measureFontMetrics(family) {
        if (metricsCache.has(family)) return metricsCache.get(family);

        let result = { asc: 0.905, desc: 0.212, cap: 0.716 };

        try {
          const ctx = document.createElement("canvas").getContext("2d");
          ctx.font = `100px ${family}`;
          const m = ctx.measureText("H");

          const cap = m.actualBoundingBoxAscent / 100;
          const asc = m.fontBoundingBoxAscent / 100;
          const desc = m.fontBoundingBoxDescent / 100;

          if ([cap, asc, desc].every(v => Number.isFinite(v) && v > 0)) {
            result = { asc, desc, cap };
          }
        } catch { }

        metricsCache.set(family, result);
        return result;
      }

      const styleCss = s => {
        const dc = s.dropcap;
        const { asc, desc, cap } = dcMetrics;
        const lh = s.p.lh;
        const n = dc.lines;
        const k = (((n - 1) * lh) / cap + 1) * dc.fit;
        const boxH = n * lh - 0.01;
        const capTopNow = boxH / 2 - (k * (asc + desc)) / 2 + k * (asc - cap);
        const capTopWant = lh / 2 + (asc - desc) / 2 - cap;
        const off = (capTopWant - capTopNow) / k;

        return [
          `.doc.doc{line-height:${s.p.lh};padding:${s.page.top}px ${s.page.right}px ${s.page.bottom}px calc(${s.page.left}px + 2.25rem)}`,
          `.doc.doc p:not([data-kind]){margin-bottom:${s.p.gap}em}`,
          `.doc.doc [data-indent]{text-indent:${s.p.indent}em}`,
          ...[1, 2, 3, 4].map(i => {
            const h = s["h" + i];
            return `.doc.doc h${i}{font-size:${h.size}px;font-weight:${h.weight};line-height:${h.lh};margin:${h.top}em 0 ${h.bottom}em}`;
          }),
          `.doc.doc [data-kind="quote"]{--ml:${s.quote.side}rem;text-align:${s.quote.align};` +
          `font-style:${s.quote.italic ? "italic" : "normal"};font-size:${s.quote.size}em;` +
          `margin:${s.quote.top}em ${s.quote.side}rem ${s.quote.bottom}em}`,
          `.doc.doc [data-kind="cite"]{--ml:${s.cite.side}rem;text-align:${s.cite.align};font-size:${s.cite.size}em;` +
          `opacity:${s.cite.opacity};margin:0 ${s.cite.side}rem ${s.cite.bottom}em}`,
          `.doc.doc [data-kind="poem"]{text-align:left;font-size:${s.poem.size}em;` +
          `line-height:${s.poem.lh};font-style:${s.poem.italic ? "italic" : "normal"};` +
          `max-width:100%;margin:0 auto}`,
          `.doc.doc :not([data-kind="poem"]) + [data-kind="poem"],` +
          `.doc.doc [data-kind="poem"]:first-child{margin-top:${s.poem.top}em}`,
          `.doc.doc [data-kind="poem"]:not(:has(+ [data-kind="poem"])){margin-bottom:${s.poem.bottom}em}`,
          `.doc.doc [data-kind="dropcap"]{display:flow-root;margin:.3em 0}`,
          `.doc.doc [data-kind="dropcap"]::first-letter{float:left;font-size:${k.toFixed(3)}em;` +
          `line-height:${(boxH / k).toFixed(4)};font-weight:${dc.weight};padding:0;` +
          `margin:${off.toFixed(4)}em calc(-1 * var(--dc-rb, 0em) + ${dc.space}em) ${(-off).toFixed(4)}em 0}`
        ].join("\n");
      };

      const fmtStyle = document.createElement("style");
      document.head.append(fmtStyle);

      let curFmt = readFormat(null);

      function applyFormat(fmt) {
        const f = fmt || readFormat(null);
        curFmt = f;
        dcMetrics = measureFontMetrics(FONTS[f.font]);
        fmtStyle.textContent = styleCss(f.style);
        const el = $("doc");
        el.style.setProperty("--doc-size", f.size + "px");
        el.style.setProperty("--doc-font", FONTS[f.font]);
      }

      function fitPoems() {
        const docEl = $("doc");
        if (docEl.hidden) return;

        let group = [];

        const flush = () => {
          if (!group.length) return;

          group.forEach(node => {
            node.style.width = "max-content";
            node.dataset.pfit = "1";
          });

          const width = Math.ceil(
            Math.max(0, ...group.map(node => node.getBoundingClientRect().width))
          );

          group.forEach(node => {
            node.style.width = `${width}px`;
          });

          group = [];
        };

        [...docEl.children].forEach(node => {
          if (node.dataset?.kind === "poem") {
            group.push(node);
            return;
          }

          flush();

          if (node.dataset?.pfit) {
            node.style.width = "";
            delete node.dataset.pfit;
          }
        });

        flush();
      }

      function fitDropcaps() {
        const docEl = $("doc");
        const nodes = docEl.querySelectorAll('[data-kind="dropcap"]');
        if (!nodes.length) return;

        const ctx = document.createElement("canvas").getContext("2d");
        ctx.font = `${curFmt.style.dropcap.weight} 100px ${FONTS[curFmt.font]}`;

        nodes.forEach(node => {
          const text = node.textContent.replace(/[\u200b\s]+/g, " ").trimStart();
          const match = /^[\p{P}\p{S}]*[\p{L}\p{N}]\p{M}*[\p{P}\p{S}]*/u.exec(text);

          let rb = 0;
          if (match) {
            const m = ctx.measureText(match[0]);
            const value = (m.width - m.actualBoundingBoxRight) / 100;
            if (Number.isFinite(value)) rb = Math.min(0.5, Math.max(-0.2, value));
          }

          const css = `${rb.toFixed(4)}em`;
          if (node.style.getPropertyValue("--dc-rb") !== css) node.style.setProperty("--dc-rb", css);
        });
      }

      function fitBlocks() {
        fitDropcaps();
        fitPoems();
      }

      let docWidth = 0;
      if (typeof ResizeObserver === "function") {
        new ResizeObserver(() => {
          const width = $("doc").clientWidth;
          if (width === docWidth) return;
          docWidth = width;
          fitPoems();
        }).observe($("doc"));
      }

      document.fonts?.ready.then(() => {
        metricsCache.clear();
        applyFormat(curFmt);
        fitBlocks();
      });

      function numberNotes() {
        const box = $("notes");
        box.replaceChildren();

        const groups = new Map();
        $("doc").querySelectorAll("[data-nid]").forEach(n => {
          const id = n.dataset.nid;
          if (!groups.has(id)) groups.set(id, []);
          groups.get(id).push(n);
        });

        box.hidden = groups.size === 0;
        if (!groups.size) return;

        box.append(Object.assign(mk("b"), { textContent: "Chú giải nghĩa" }));

        let i = 0;
        groups.forEach(nodes => {
          i++;
          nodes[nodes.length - 1].dataset.n = String(i);

          const word = nodes.map(n => n.textContent).join("").replace(/[​\s]+/g, " ").trim();
          const row = mk("button", "note-row");
          row.type = "button";
          row.title = "Đi tới chữ được chú giải";

          const numEl = mk("sup");
          numEl.textContent = String(i);

          const strong = mk("strong");
          strong.textContent = word;
          const small = mk("small");
          small.textContent = nodes[0].dataset.note || "";

          const body = mk("span");
          body.append(strong, small);

          row.append(numEl, body);
          row.addEventListener("click", () => goToSpot(nodes[0]));
          box.append(row);
        });
      }

      function paint(node, c) {
        if (c === GR) {
          node.style.backgroundImage = GRAD;
          node.style.webkitBackgroundClip = node.style.backgroundClip = "text";
          node.style.webkitTextFillColor = "transparent";
          node.style.color = "transparent";
        } else if (c) node.style.color = c;
      }

      function runs(list, parent) {
        if (!Array.isArray(list)) return;
        list.forEach(r => {
          if (!r || typeof r.text !== "string") return;
          const c = r.gradient === true ? GR : color(r.color);
          const size = num(r.size, 8, 200);
          const font = FONTS[r.font];
          const noteText = typeof r.note === "string" ? r.note.replace(/\s+/g, " ").trim().slice(0, 300) : "";
          const nid = noteText && typeof r.nid === "string" && /^[\w-]{1,40}$/.test(r.nid) ? r.nid : null;
          const styled = c || size || font || r.bold || r.italic || r.underline || nid;

          r.text.replace(/[\u200b\r]/g, "").replace(/\u00a0/g, " ").split("\n").forEach((part, i) => {
            if (i) parent.append(mk("br"));
            if (!part) return;
            if (!styled) { parent.append(part); return; }

            const s = mk("span");
            s.textContent = part;
            if (nid) {
              s.dataset.nid = nid;
              s.dataset.note = noteText;
              s.title = noteText;
            }
            paint(s, c);
            if (size) s.style.fontSize = size + "px";
            if (font) s.style.fontFamily = font;
            if (r.bold) s.style.fontWeight = "700";
            if (r.italic) s.style.fontStyle = "italic";
            if (r.underline) s.style.textDecoration = "underline";
            parent.append(s);
          });
        });
      }

      function figure(b) {
        const url = src(b.src);
        if (!url) return null;

        const fig = mk("figure");
        if (b.align === "center" || b.align === "right") fig.style.textAlign = b.align;

        const wrap = mk("span", "wrap");
        wrap.style.width = (num(b.width, 24, 1200) ?? 160) + "px";

        const img = new Image();
        img.src = url;
        img.alt = "Ảnh";
        wrap.append(img);

        const c = color(b.color);
        if (c) {
          img.style.visibility = "hidden";
          const tint = mk("span", "mask");
          tint.style.webkitMaskImage = tint.style.maskImage = `url("${url}")`;
          if (c === GR) tint.style.backgroundImage = GRAD;
          else tint.style.backgroundColor = c;
          wrap.append(tint);
        }

        fig.append(wrap);
        return fig;
      }

      let tocItems = [];
      let activeToc = null;
      let tocFolded = narrow.matches;

      function updateSpy() {
        if (!tocItems.length || $("toc").hidden) return;

        let current = null;
        for (const item of tocItems) {
          if (item.el.getBoundingClientRect().top <= 140) current = item;
          else break;
        }
        current = current || tocItems[0];
        if (current === activeToc) return;

        if (activeToc) activeToc.li.classList.remove("active");
        current.li.classList.add("active");
        activeToc = current;

        const tocEl = $("toc");
        if (!narrow.matches && tocEl.scrollHeight > tocEl.clientHeight) {
          const target = current.li.offsetTop - tocEl.clientHeight / 2;
          tocEl.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
        }
      }

      function buildToc() {
        const tocEl = $("toc");
        const docEl = $("doc");
        const toggleBtn = $("tocToggle");
        tocEl.replaceChildren();
        tocItems = [];
        activeToc = null;

        const headings = docEl.hidden ? [] : [...docEl.querySelectorAll("h1, h2, h3, h4")];
        const items = headings
          .map((h, idx) => {
            const text = (h.textContent || "").replace(/[\u200b\s]+/g, " ").trim();
            if (!text) return null;
            const id = `mixer-sec-${idx + 1}`;
            h.id = id;
            return {
              id,
              el: h,
              level: Number(h.tagName.slice(1)),
              text
            };
          })
          .filter(Boolean);

        const hasHeadings = items.length > 0;
        if (toggleBtn) {
          toggleBtn.hidden = !hasHeadings;
          toggleBtn.setAttribute("aria-pressed", String(tocEnabled));
        }

        if (!hasHeadings || !tocEnabled) {
          tocEl.hidden = true;
          return;
        }

        const tocAction = (icon, title, fn) => {
          const btn = mk("span", "toc-export");
          btn.setAttribute("role", "button");
          btn.tabIndex = 0;
          btn.title = title;
          btn.setAttribute("aria-label", title);
          btn.append(ico(icon));
          btn.addEventListener("click", e => { e.stopPropagation(); fn(); });
          btn.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              e.stopPropagation();
              fn();
            }
          });
          return btn;
        };
        const bmTog = tocAction("mdi:bookmark", "Bật/tắt bookmark", toggleBm);
        bmTog.dataset.bmToggle = "1";
        const exp = tocAction("lucide:download", "Xuất JSON", () => showExportMenu(exp));
        exp.dataset.exportTrigger = "1";

        const fold = mk("button", "toc-fold");
        fold.type = "button";
        fold.setAttribute("aria-expanded", String(!tocFolded));
        fold.append(
          ico("lucide:list"),
          textSpan("Mục lục"),
          bmTog,
          exp,
          ico("lucide:chevron-down", "toc-chevron")
        );
        fold.addEventListener("click", () => {
          tocFolded = !tocFolded;
          tocEl.classList.toggle("folded", tocFolded);
          fold.setAttribute("aria-expanded", String(!tocFolded));
        });
        tocEl.classList.toggle("folded", tocFolded);
        tocEl.append(fold);

        const list = mk("ul", "toc-list");
        items.forEach(item => {
          const li = mk("li", "toc-item");
          li.dataset.level = String(item.level);

          const link = document.createElement("a");
          link.className = "toc-link";
          link.href = `#${item.id}`;
          link.textContent = item.text;
          link.addEventListener("click", e => {
            e.preventDefault();
            const target = document.getElementById(item.id);
            if (target) {
              target.scrollIntoView({ behavior: "smooth", block: "start" });
              closeAbout(false);
            }
          });

          li.append(link);
          list.append(li);
          tocItems.push({ el: item.el, li });
        });

        tocEl.append(list);
        tocEl.hidden = false;
        syncBm();
        updateSpy();
      }

      let spyTicking = false;
      const requestSpy = () => {
        if (spyTicking) return;
        spyTicking = true;
        requestAnimationFrame(() => {
          spyTicking = false;
          updateSpy();
        });
      };
      addEventListener("scroll", requestSpy, { passive: true });
      addEventListener("resize", requestSpy);

      function syncBm() {
        $("doc").classList.toggle("no-bm", !bmOn);
        document.querySelectorAll("[data-bm-toggle]").forEach(el => {
          el.setAttribute("aria-pressed", String(bmOn));
          el.title = bmOn ? "Tắt bookmark" : "Bật bookmark";
          el.querySelector("iconify-icon")?.setAttribute("icon", bmOn ? "mdi:bookmark" : "mdi:bookmark-off-outline");
        });
      }

      function toggleBm() {
        bmOn = !bmOn;
        try { localStorage.setItem(BM_KEY, String(bmOn)); } catch { }
        syncBm();
        renderSpots();
      }

      function spotText(on) {
        return on ? "Bỏ đánh dấu đoạn này" : "Đánh dấu đoạn này";
      }

      function toggleSpot(id, i) {
        const set = spotSet(id);
        const on = !set.has(i);
        if (on) set.add(i); else set.delete(i);
        saveSpots();

        const node = $("doc").querySelector(`[data-b="${i}"]`);
        if (node) {
          node.toggleAttribute("data-marked", on);
          const btn = node.querySelector(":scope > .mk");
          if (btn) {
            btn.setAttribute("aria-pressed", String(on));
            btn.setAttribute("aria-label", spotText(on));
            btn.title = spotText(on);
            btn.firstChild?.setAttribute("icon", on ? "mdi:bookmark" : "mdi:bookmark-outline");
          }
        }
        renderSpots();
      }

      function spotLabel(node) {
        if (node.tagName === "FIGURE") return "Ảnh";
        if (node.classList.contains("tw")) return "Bảng";
        return (node.textContent || "").replace(/[\u200b\s]+/g, " ").trim().slice(0, 48) || "(trống)";
      }

      function goToSpot(node) {
        node.scrollIntoView({ behavior: "smooth", block: "center" });
        node.classList.remove("flash");
        void node.offsetWidth;
        node.classList.add("flash");
        setTimeout(() => node.classList.remove("flash"), 1200);
      }

      function renderSpots() {
        const box = $("spots");
        const list = $("spotsList");
        list.replaceChildren();

        const id = docs[activeDocIndex]?.id;
        if (!id || $("doc").hidden || !bmOn) {
          box.hidden = true;
          return;
        }

        const set = spotSet(id);
        const nodes = [...$("doc").querySelectorAll("[data-b]")].filter(n => set.has(Number(n.dataset.b)));
        box.hidden = nodes.length === 0;
        $("spotsCount").textContent = String(nodes.length);

        nodes.forEach(node => {
          const label = spotLabel(node);
          const row = mk("li", "mark-row");

          const link = mk("button", "mark-link");
          link.type = "button";
          link.title = label;
          // link.append(ico("mdi:bookmark"), textSpan(label));
          link.append(textSpan(label));
          link.addEventListener("click", () => goToSpot(node));

          const remove = mk("button", "mark-remove");
          remove.type = "button";
          remove.setAttribute("aria-label", "Bỏ đánh dấu vị trí: " + label);
          remove.title = "Bỏ đánh dấu";
          remove.append(ico("lucide:x"));
          remove.addEventListener("click", () => toggleSpot(id, Number(node.dataset.b)));

          row.append(link, remove);
          list.append(row);
        });
      }

      const docAnnots = () => {
        const id = docs[activeDocIndex]?.id;
        return id ? annots.filter(a => a.doc === id) : [];
      };

      function textNodesOf(block) {
        const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
          acceptNode: n => n.parentElement && n.parentElement.closest(".mk")
            ? NodeFilter.FILTER_REJECT
            : NodeFilter.FILTER_ACCEPT
        });
        const out = [];
        let n;
        while ((n = walker.nextNode())) out.push(n);
        return out;
      }

      function highlightSeg(id, seg) {
        const block = $("doc").querySelector(`[data-b="${seg.b}"]`);
        if (!block) return;

        let pos = 0;
        textNodesOf(block).forEach(node => {
          const len = node.length;
          const from = Math.max(seg.s, pos) - pos;
          const to = Math.min(seg.e, pos + len) - pos;
          pos += len;
          if (to <= from) return;

          let target = node;
          if (from > 0) target = node.splitText(from);
          if (to - from < target.length) target.splitText(to - from);

          const m = document.createElement("mark");
          m.className = "annot-hl";
          m.dataset.aid = id;
          target.replaceWith(m);
          m.append(target);
        });
      }

      const segsOf = a => {
        const ok = x => x && Number.isInteger(x.b) && Number.isInteger(x.s) && Number.isInteger(x.e) && x.e > x.s;
        const list = Array.isArray(a.segs) ? a.segs.filter(ok) : [];
        return list.length ? list : [{ b: a.b, s: a.s, e: a.e }];
      };

      function highlightOne(a) {
        segsOf(a).forEach(seg => highlightSeg(a.id, seg));
      }

      function clearHighlights() {
        const docEl = $("doc");
        docEl.querySelectorAll("mark.annot-hl").forEach(m => m.replaceWith(...m.childNodes));
        docEl.normalize();
      }

      function applyHighlights() {
        docAnnots().forEach(highlightOne);
      }

      function closeNote(id) {
        if (openNotes.delete(id)) renderAnnots();
      }

      function openNote(id, focus) {
        openNotes.add(id);
        $("annots").classList.remove("collapsed");
        renderAnnots(focus ? id : undefined);
      }

      function renderAnnots(focusId) {
        const box = $("annots");
        const list = $("annotsList");
        list.replaceChildren();

        if (!docs[activeDocIndex] || $("doc").hidden) {
          box.hidden = true;
          return;
        }

        const items = docAnnots()
          .filter(a => openNotes.has(a.id))
          .sort((x, y) => x.b - y.b || x.s - y.s);
        box.hidden = items.length === 0;

        items.forEach(a => {
          const li = mk("li", "annot-row");
          li.dataset.aid = a.id;
          li.addEventListener("pointerdown", e => {
            if (e.target.closest("button")) li._keep = true;
          });

          const top = mk("div", "annot-top");

          const quote = mk("button", "annot-quote");
          quote.type = "button";
          quote.title = a.quote;
          quote.textContent = a.quote;
          quote.addEventListener("click", () => {
            li._keep = false;
            const h = $("doc").querySelector(`mark[data-aid="${a.id}"]`);
            if (h) goToSpot(h);
          });

          const eye = mk("button", "mark-remove");
          eye.type = "button";
          eye.setAttribute("aria-label", "Ẩn ghi chú");
          eye.title = "Ẩn ghi chú (bấm lại vào đoạn đã tô để mở)";
          eye.append(ico("lucide:eye"));
          eye.addEventListener("click", () => {
            li._keep = false;
            closeNote(a.id);
          });

          const remove = mk("button", "mark-remove");
          remove.type = "button";
          remove.setAttribute("aria-label", "Xóa ghi chú");
          remove.title = "Xóa ghi chú";
          remove.append(ico("lucide:x"));
          remove.addEventListener("click", () => {
            li._keep = false;
            openNotes.delete(a.id);
            annots = annots.filter(x => x.id !== a.id);
            saveAnnots();
            clearHighlights();
            applyHighlights();
            renderAnnots();
          });

          top.append(quote, eye, remove);

          const ta = mk("textarea", "annot-input");
          ta.rows = 2;
          ta.maxLength = 1000;
          ta.placeholder = "Nhập ghi chú...";
          ta.value = a.note;
          ta.setAttribute("aria-label", "Ghi chú cho đoạn: " + a.quote.slice(0, 40));
          const fit = () => {
            ta.style.height = "auto";
            ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
          };
          ta.addEventListener("input", () => {
            a.note = ta.value;
            fit();
            clearTimeout(annotSaveTimer);
            annotSaveTimer = setTimeout(saveAnnots, 300);
          });
          ta.addEventListener("blur", () => {
            setTimeout(() => {
              if (li._keep) { li._keep = false; return; }
              if (!document.hasFocus() || document.activeElement === ta) return;
              closeNote(a.id);
            }, 150);
          });

          li.append(top, ta);
          list.append(li);
          if (a.note) requestAnimationFrame(fit);
        });

        if (focusId) {
          const row = list.querySelector(`[data-aid="${focusId}"]`);
          row?.querySelector("textarea")?.focus({ preventScroll: true });
        }
      }

      const selBtn = $("selBtn");
      const annotsBox = $("annots");
      const railEl = document.querySelector(".rail");
      function placeAnnots() {
        if (narrow.matches) {
          if (annotsBox.parentElement !== document.body) document.body.append(annotsBox);
        } else if (annotsBox.parentElement !== railEl) {
          $("spots").after(annotsBox);
        }
      }
      placeAnnots();
      narrow.addEventListener("change", placeAnnots);
      let pendingSel = null;
      let selTimer = 0;

      function currentSel() {
        const docEl = $("doc");
        const sel = getSelection();
        if (docEl.hidden || !sel || sel.rangeCount === 0 || sel.isCollapsed) return null;

        const r = sel.getRangeAt(0);
        if (!docEl.contains(r.commonAncestorContainer)) return null;

        const blocks = [...docEl.querySelectorAll("[data-b]")];
        const hit = blocks.filter(blk => r.intersectsNode(blk));
        if (!hit.length) return null;

        const elOf = n => n.nodeType === 1 ? n : n.parentElement;
        const sb = elOf(r.startContainer)?.closest("[data-b]");
        const eb = elOf(r.endContainer)?.closest("[data-b]");
        const first = sb && docEl.contains(sb) ? sb : hit[0];
        const last = eb && docEl.contains(eb) ? eb : hit[hit.length - 1];
        const i0 = blocks.indexOf(first);
        const i1 = blocks.indexOf(last);
        if (i0 < 0 || i1 < i0) return null;

        const segs = [];
        const quotes = [];
        for (let i = i0; i <= i1; i++) {
          const blk = blocks[i];
          const rng = document.createRange();
          rng.selectNodeContents(blk);
          const full = rng.toString();

          let s = 0;
          let e = full.length;
          if (blk === sb) {
            rng.setEnd(r.startContainer, r.startOffset);
            s = rng.toString().length;
          }
          if (blk === eb) {
            rng.selectNodeContents(blk);
            rng.setEnd(r.endContainer, r.endOffset);
            e = rng.toString().length;
          }

          const raw = full.slice(s, e);
          const text = raw.trim();
          if (!text) continue;
          s += raw.length - raw.trimStart().length;
          e = s + text.length;

          segs.push({ b: Number(blk.dataset.b), s, e });
          quotes.push(text.replace(/\s+/g, " "));
        }
        if (!segs.length) return null;

        return {
          sel: { segs, quote: quotes.join(" ").slice(0, 300) },
          rect: r.getBoundingClientRect()
        };
      }

      async function exportJson(withNotes = true, zip = true) {
        const d = docs[activeDocIndex];
        if (!d) return;

        const f = d.fmt || readFormat(null);
        const notes = !withNotes ? [] : docAnnots()
          .sort((x, y) => x.b - y.b || x.s - y.s)
          .map(a => ({ block: a.b, start: a.s, end: a.e, segments: segsOf(a), text: a.quote, note: a.note }));

        const data = {
          app: "mixer",
          version: 1,
          title: d.label,
          exportedAt: new Date().toISOString(),
          docStyle: f.style,
          docSize: f.size,
          docFont: f.font,
          colorLegend: legend,
          blocks: d.blocks,
          bookmarks: [...spotSet(d.id)].sort((x, y) => x - y),
          annotations: notes
        };

        const name = (d.label || "tai-lieu")
          .replace(/[\\/:*?"<>|\u0000-\u001f]+/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 80) || "tai-lieu";

        if (!withNotes) {
          delete data.annotations;
          delete data.bookmarks;
        }

        const json = JSON.stringify(data);
        let blob = new Blob([json], { type: "application/json" });
        let ext = ".json";
        if (zip && typeof CompressionStream === "function") {
          try {
            blob = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"))).blob();
            ext = ".json.gz";
          } catch (error) {
            console.warn("Không nén được, xuất JSON thường:", error);
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${name}${withNotes ? "-co-ghi-chu" : ""}${ext}`;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);

      function render(blocks) {
        const root = $("doc");
        root.replaceChildren();
        const docId = docs[activeDocIndex]?.id;
        let list = null;

        const addMarker = (node, i) => {
          if (!docId) return;
          const on = spotSet(docId).has(i);
          node.dataset.b = String(i);
          node.classList.add("mk-host");
          node.toggleAttribute("data-marked", on);

          const btn = mk("button", "mk");
          btn.type = "button";
          btn.setAttribute("aria-pressed", String(on));
          btn.setAttribute("aria-label", spotText(on));
          btn.title = spotText(on);
          btn.append(ico(on ? "mdi:bookmark" : "mdi:bookmark-outline"));
          btn.addEventListener("click", e => {
            e.preventDefault();
            toggleSpot(docId, i);
          });
          node.prepend(btn);
        };

        (Array.isArray(blocks) ? blocks : []).forEach((b, i) => {
          if (!b || typeof b !== "object") return;
          const t = b.type;
          const align = ALIGNS.includes(b.align) ? b.align : null;

          if (t === "ul" || t === "ol") {
            if (!list || list.tagName.toLowerCase() !== t) { list = mk(t); root.append(list); }
            const li = mk("li", align === "center" ? "c" : align === "right" ? "r" : "");
            if (align) li.style.textAlign = align;
            runs(b.runs, li);
            if (li.firstChild) addMarker(li, i);
            list.append(li);
            return;
          }
          list = null;

          if (t === "img") {
            const f = figure(b);
            if (f) { addMarker(f, i); root.append(f); }
            return;
          }

          if (t === "table") {
            const table = mk("table", b.header === true ? "h" : "");
            (Array.isArray(b.rows) ? b.rows : []).slice(0, 50).forEach(row => {
              if (!Array.isArray(row)) return;
              const tr = table.insertRow();
              row.slice(0, 12).forEach(cell => {
                const td = tr.insertCell();
                runs(cell, td);
                if (!td.firstChild) td.append(mk("br"));
              });
            });
            const holder = mk("div", "tw");
            holder.append(table);
            addMarker(holder, i);
            root.append(holder);
            return;
          }

          const special = SPECIAL_KINDS.includes(t);
          const node = mk(/^h[1-4]$/.test(t) ? t : "p");
          if (special) node.dataset.kind = t;
          if (t === "p" && b.indent === true) node.dataset.indent = "1";
          if (align) node.style.textAlign = align;
          runs(b.runs, node);
          if (node.firstChild) addMarker(node, i);
          else node.classList.add("e");
          root.append(node);
        });

        numberNotes();
        buildToc();
      }

      function usedColors(blocks) {
        const seen = new Set();
        (blocks || []).forEach(b => {
          if (!b) return;
          if (b.type === "img") { const c = color(b.color); if (c) seen.add(c); return; }
          const all = b.type === "table" && Array.isArray(b.rows) ? b.rows.flat(2) : b.runs;
          (Array.isArray(all) ? all : []).forEach(r => {
            const c = r && (r.gradient === true ? GR : color(r.color));
            if (c) seen.add(c);
          });
        });
        return [...seen];
      }

      function extractBlocks(data) {
        if (!data || typeof data !== "object") return null;
        if (Array.isArray(data)) return data;
        if (Array.isArray(data.blocks)) return data.blocks;
        if (Array.isArray(data.sentenceBlocks)) return data.sentenceBlocks;
        if (Array.isArray(data.document?.blocks)) return data.document.blocks;
        if (typeof data.document === "string") {
          try {
            const parsedDoc = JSON.parse(data.document);
            if (Array.isArray(parsedDoc)) return parsedDoc;
            if (Array.isArray(parsedDoc?.blocks)) return parsedDoc.blocks;
          } catch { }
        }
        return null;
      }

      function scanLocalStorage(targetDocs, targetLegend) {
        try {
          const seenKeys = new Set();
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (!key || RESERVED_KEYS.has(key) || seenKeys.has(key)) continue;
            seenKeys.add(key);

            const raw = localStorage.getItem(key);
            if (!raw || raw.length > MAX_SIZE) continue;

            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch {
              continue;
            }

            if (parsed && typeof parsed.colorLegend === "object" && parsed.colorLegend) {
              Object.assign(targetLegend, parsed.colorLegend);
            }

            const fmt = readFormat(parsed);

            const mainBlocks = extractBlocks(parsed);
            if (Array.isArray(mainBlocks) && mainBlocks.length) {
              const label = String(
                parsed?.title || parsed?.name ||
                (Array.isArray(parsed?.sentenceBlocks) ? "Bản nháp đang soạn" : key)
              );
              targetDocs.push({
                id: `local:${key}`,
                label,
                name: `[Local] ${label}`,
                blocks: mainBlocks,
                fmt
              });
            }

            const savedList = Array.isArray(parsed?.savedSentences)
              ? parsed.savedSentences
              : Array.isArray(parsed?.documents)
                ? parsed.documents
                : Array.isArray(parsed?.items)
                  ? parsed.items
                  : [];

            savedList.forEach((s, idx) => {
              const sBlocks = extractBlocks(s);
              if (Array.isArray(sBlocks) && sBlocks.length) {
                const label = typeof s?.name === "string" && s.name ? s.name : key + " #" + (idx + 1);
                targetDocs.push({
                  id: `local:${key}#${idx}`,
                  label,
                  name: `[Local] ${label}`,
                  blocks: sBlocks,
                  fmt
                });
              }
            });
          }
        } catch (err) {
          console.warn("Không thể quét localStorage:", err);
        }
      }

      function load(data) {
        const nextDocs = [];
        const nextLegend = data && typeof data.colorLegend === "object" && data.colorLegend ? { ...data.colorLegend } : {};

        const fmt = readFormat(data);
        const main = extractBlocks(data);
        if (Array.isArray(main) && main.length) {
          const label = String(data?.title || data?.name || "Tài liệu hiện tại");
          nextDocs.push({ id: "file:main", label, name: label, blocks: main, fmt });
        }

        (Array.isArray(data?.savedSentences) ? data.savedSentences : []).forEach((s, i) => {
          const sBlocks = extractBlocks(s);
          if (Array.isArray(sBlocks) && sBlocks.length) {
            const label = typeof s?.name === "string" && s.name ? s.name : "Tệp " + (i + 1);
            nextDocs.push({ id: `file:${i}`, label, name: label, blocks: sBlocks, fmt });
          }
        });

        scanLocalStorage(nextDocs, nextLegend);

        if (!nextDocs.length) throw new Error("empty");

        [...spotStore.keys()].filter(k => k.startsWith("file:")).forEach(k => spotStore.delete(k));
        annots = annots.filter(a => !a.doc.startsWith("file:"));

        if (nextDocs.some(d => d.id === "file:main")) {
          (Array.isArray(data?.annotations) ? data.annotations : []).slice(0, 500).forEach(n => {
            if (n && Number.isInteger(n.block) && Number.isInteger(n.start) && Number.isInteger(n.end) &&
              n.end > n.start && typeof n.text === "string") {
              annots.push({
                id: newAnnotId(),
                doc: "file:main",
                b: n.block,
                s: n.start,
                e: n.end,
                segs: Array.isArray(n.segments) ? n.segments.filter(x => x && Number.isInteger(x.b) && Number.isInteger(x.s) && Number.isInteger(x.e) && x.e > x.s).slice(0, 200) : undefined,
                quote: n.text.slice(0, 300),
                note: typeof n.note === "string" ? n.note.slice(0, 1000) : ""
              });
            }
          });
          (Array.isArray(data?.bookmarks) ? data.bookmarks : []).filter(Number.isInteger)
            .forEach(i => spotSet("file:main").add(i));
        }

        docs = nextDocs;
        legend = nextLegend;
        show(0);
      }

      async function inflate(u8, format) {
        if (typeof DecompressionStream !== "function") throw new Error("nodecomp");
        const reader = new Blob([u8]).stream().pipeThrough(new DecompressionStream(format)).getReader();
        const chunks = [];
        let total = 0;
        for (; ;) {
          const { done, value } = await reader.read();
          if (done) break;
          total += value.length;
          if (total > MAX_UNPACKED) { reader.cancel(); throw new Error("size"); }
          chunks.push(value);
        }
        const out = new Uint8Array(total);
        let o = 0;
        chunks.forEach(c => { out.set(c, o); o += c.length; });
        return out;
      }

      async function unzip(u8) {
        const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
        let end = -1;
        for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
          if (dv.getUint32(i, true) === 0x06054b50) { end = i; break; }
        }
        if (end < 0) throw new Error("zip");

        const count = dv.getUint16(end + 10, true);
        let p = dv.getUint32(end + 16, true);
        for (let n = 0; n < count; n++) {
          if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
          const method = dv.getUint16(p + 10, true);
          const csize = dv.getUint32(p + 20, true);
          const nl = dv.getUint16(p + 28, true);
          const xl = dv.getUint16(p + 30, true);
          const cl = dv.getUint16(p + 32, true);
          const lho = dv.getUint32(p + 42, true);
          const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
          p += 46 + nl + xl + cl;

          if (!/\.json$/i.test(name)) continue;
          const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
          const data = u8.subarray(start, start + csize);
          if (method === 0) return data;
          if (method === 8) return inflate(data, "deflate-raw");
          break;
        }
        throw new Error("zip");
      }

      async function bytesToJson(buf) {
        let u8 = new Uint8Array(buf);
        if (u8[0] === 0x1f && u8[1] === 0x8b) u8 = await inflate(u8, "gzip");
        else if (u8[0] === 0x50 && u8[1] === 0x4b) u8 = await unzip(u8);
        else {
          const text = new TextDecoder().decode(u8).trim();
          if (/^H4sI[A-Za-z0-9+/=\s]+$/.test(text)) {
            const bin = atob(text.replace(/\s+/g, ""));
            u8 = await inflate(Uint8Array.from(bin, c => c.charCodeAt(0)), "gzip");
          } else {
            return JSON.parse(text);
          }
        }
        return JSON.parse(new TextDecoder().decode(u8));
      }

      async function readFile(file) {
        try {
          if (file.size > MAX_PACKED) throw new Error("size");
          load(await bytesToJson(await file.arrayBuffer()));
          closeAbout(false);
        } catch {
          alert("Không đọc được tệp JSON (hoặc JSON nén .gz / .zip) hợp lệ của trình soạn thảo.");
        }
      }

      async function loadFromApi(raw) {
        const msg = $("apiMsg");
        const say = (text, err) => { msg.textContent = text; msg.dataset.err = err ? "1" : ""; };

        let url;
        try {
          url = new URL(raw.trim(), location.href);
          if (url.protocol !== "https:" && url.protocol !== "http:") throw new Error("proto");
        } catch {
          say("Đường dẫn API không hợp lệ.", true);
          return;
        }

        say("Đang tải…");
        $("apiGo").disabled = true;
        try {
          const res = await fetch(url, { credentials: "omit", cache: "no-store" });
          if (!res.ok) throw new Error("http");
          if (Number(res.headers.get("content-length")) > MAX_PACKED) throw new Error("size");
          const buf = await res.arrayBuffer();
          if (buf.byteLength > MAX_PACKED) throw new Error("size");
          load(await bytesToJson(buf));
          say("");
          closeAbout(false);
        } catch (err) {
          openAbout(trigger);
          say(err?.message === "size"
            ? "Dữ liệu quá lớn."
            : "Không đọc được dữ liệu. Kiểm tra đường dẫn, CORS của API hoặc định dạng JSON nén.", true);
        } finally {
          $("apiGo").disabled = false;
        }
      }

      (() => {
        const localDocs = [];
        const localLegend = {};
        scanLocalStorage(localDocs, localLegend);
        docs = localDocs;
        legend = localLegend;
        activeDocIndex = -1;
        $("doc").hidden = true;
        $("legend").hidden = true;
        $("toc").hidden = true;
        renderLists();

        const srcParam = new URLSearchParams(location.search).get("src");
        if (srcParam) {
          $("apiUrl").value = srcParam;
          loadFromApi(srcParam);
        } else {
          openAbout(trigger);
        }
      })();

      $("tocToggle").onclick = () => {
        tocEnabled = !tocEnabled;
        try {
          localStorage.setItem(TOC_PREF_KEY, String(tocEnabled));
        } catch { }
        buildToc();
      };

      $("file").onchange = e => {
        const f = e.target.files?.[0];
        e.target.value = "";
        if (f) readFile(f);
      };

      $("apiForm").addEventListener("submit", e => {
        e.preventDefault();
        loadFromApi($("apiUrl").value);
      });
    })();
  </script>
</body>

</html>
